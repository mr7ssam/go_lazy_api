name: common
description: Common package for shared logic and classes
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  cloudinary_api:
    git:
      url: https://github.com/mr7ssam/cloudinary_dart.git
      path: api
  cloudinary_url_gen:
    git:
      url: https://github.com/mr7ssam/cloudinary_dart.git
      path: url_gen
  dart_frog: ^1.1.0
  dart_frog_auth: ^1.2.2
  dart_jsonwebtoken: ^3.2.0
  freezed_annotation: ^3.1.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1


dev_dependencies:
  build_runner: ^2.4.13
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  test: ^1.25.5
